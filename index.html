<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Companion - Catan Dice</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome for UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        canvas {
            outline: none;
        }
        .custom-glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-glow {
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
            transition: all 0.2s ease-in-out;
        }
        .btn-glow:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col overflow-x-hidden select-none">

    <!-- Header -->
    <header class="w-full py-4 px-6 custom-glass flex justify-between items-center z-10 border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-amber-500/20 text-amber-400 rounded-lg">
                <i class="fa-solid font-bold fa-dice-d6 text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-amber-400">Catan Game Companion</h1>
                <p class="text-xs text-slate-400">Ειδικό Companion με 3 Ζάρια</p>
            </div>
        </div>
        
        <button id="resetStatsBtn" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
            <i class="fa-solid fa-rotate-left"></i>
            <span>Επανεκκίνηση</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col md:flex-row relative">
        
        <!-- 3D Canvas Area -->
        <div class="flex-1 relative min-h-[380px] md:min-h-full flex items-center justify-center">
            <div id="canvasContainer" class="w-full h-full absolute inset-0 cursor-pointer"></div>
            
            <!-- Instructions Overlay -->
            <div id="clickHint" class="absolute bottom-6 pointer-events-none text-center w-full px-4">
                <span class="bg-slate-950/80 text-amber-300 border border-amber-500/30 text-xs md:text-sm px-4 py-2 rounded-full shadow-lg backdrop-blur-md">
                    💡 Πιέστε <strong>"ΡΙΨΗ"</strong> ή κάντε <strong>κλικ στην οθόνη</strong> για να ρίξετε τα ζάρια!
                </span>
            </div>
        </div>

        <!-- Right / Bottom Dashboard Panel -->
        <aside class="w-full md:w-80 custom-glass border-t md:border-t-0 md:border-l border-slate-800 p-5 flex flex-col justify-between z-10">
            
            <!-- Result Display Box -->
            <div class="space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2">
                    Αποτελεσμα Τελευταιας Ριψης
                </h2>

                <div id="resultDisplay" class="bg-slate-950/60 rounded-xl p-4 border border-slate-800 space-y-3">
                    <!-- Red & Yellow Sum -->
                    <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-lg border border-slate-800">
                        <span class="text-sm font-medium text-slate-300">Άθροισμα Αριθμών:</span>
                        <span id="totalValue" class="text-2xl font-black text-amber-400">--</span>
                    </div>

                    <!-- Individual Dice Results -->
                    <div class="grid grid-cols-3 gap-2 text-center text-xs">
                        <div class="bg-red-950/40 border border-red-500/30 p-2 rounded-lg">
                            <span class="block text-red-400 font-bold mb-1">Κόκκινο</span>
                            <span id="redVal" class="text-lg font-bold text-slate-100">--</span>
                        </div>
                        <div class="bg-yellow-950/40 border border-yellow-500/30 p-2 rounded-lg">
                            <span class="block text-yellow-400 font-bold mb-1">Κίτρινο</span>
                            <span id="yellowVal" class="text-lg font-bold text-slate-100">--</span>
                        </div>
                        <div class="bg-slate-800/60 border border-slate-600/40 p-2 rounded-lg flex flex-col justify-center items-center">
                            <span class="block text-slate-300 font-bold mb-1">Ειδικό</span>
                            <span id="eventVal" class="text-sm font-bold text-slate-100 min-h-[24px] flex items-center justify-center">--</span>
                        </div>
                    </div>
                </div>

                <!-- History -->
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Ιστορικό Ρίψεων</h3>
                    <div id="historyList" class="max-h-40 overflow-y-auto space-y-1.5 pr-1 text-xs text-slate-300">
                        <div class="text-slate-500 text-center py-4 italic">Δεν υπάρχουν ακόμη ρίψεις.</div>
                    </div>
                </div>
            </div>

            <!-- Roll Button & Action Controls -->
            <div class="pt-4 mt-4 border-t border-slate-800 space-y-3">
                <button id="rollBtn" class="w-full py-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-lg tracking-wider rounded-xl uppercase btn-glow transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-dice text-2xl"></i>
                    <span>ΡΙΨΗ (Space)</span>
                </button>

                <div class="flex justify-between items-center text-xs text-slate-400 px-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="soundToggle" checked class="rounded bg-slate-800 border-slate-700 text-amber-500 focus:ring-amber-500">
                        <span>Ήχος Ρίψης</span>
                    </label>
                    <span id="rollCounter" class="text-slate-500">Σύνολο: 0</span>
                </div>
            </div>

        </aside>
    </main>

    <script>
        // --- Web Audio Synthesizer for Roll Sound (No External Audio File Needed) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playRollSound() {
            const soundEnabled = document.getElementById('soundToggle').checked;
            if (!soundEnabled) return;

            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;
                // Generate series of clicks for rolling audio effect
                for (let i = 0; i < 8; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150 + Math.random() * 250, now + i * 0.05);
                    osc.frequency.exponentialRampToValueAtTime(40, now + i * 0.05 + 0.04);

                    gain.gain.setValueAtTime(0.2, now + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.04);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + i * 0.05);
                    osc.stop(now + i * 0.05 + 0.04);
                }
            } catch (e) {
                console.log("Audio not allowed yet");
            }
        }

        // --- Texture Generators using Canvas HTML ---
        
        // Face definition for Standard Dice (Dots)
        function createStandardDiceFaceTexture(number, bgColor, dotColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 256, 256);

            // Border / Inner Shadow effect
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 12;
            ctx.strokeRect(6, 6, 244, 244);

            // Dots
            ctx.fillStyle = dotColor;
            const radius = 22;
            const dots = {
                1: [[128, 128]],
                2: [[68, 68], [188, 188]],
                3: [[68, 68], [128, 128], [188, 188]],
                4: [[68, 68], [188, 68], [68, 188], [188, 188]],
                5: [[68, 68], [188, 68], [128, 128], [68, 188], [188, 188]],
                6: [[68, 60], [188, 60], [68, 128], [188, 128], [68, 196], [188, 196]]
            };

            const positions = dots[number] || [];
            positions.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Dot shine
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(x - 5, y - 5, radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = dotColor;
            });

            return new THREE.CanvasTexture(canvas);
        }

        // Face definition for Event Dice (3x Pirate Ship, 3x Palaces)
        function createEventDiceFaceTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // White Background
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, 256, 256);

            // Subtle border
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, 246, 246);

            if (type === 'ship') {
                // Pirate Ship Silhouette (Black/Dark Grey)
                ctx.fillStyle = '#0f172a';
                
                // Hull
                ctx.beginPath();
                ctx.moveTo(40, 150);
                ctx.quadraticCurveTo(128, 195, 216, 150);
                ctx.lineTo(195, 180);
                ctx.quadraticCurveTo(128, 205, 60, 180);
                ctx.closePath();
                ctx.fill();

                // Masts & Sails
                ctx.fillRect(122, 60, 12, 100); // Main mast
                ctx.fillRect(75, 80, 8, 70);   // Fore mast
                ctx.fillRect(175, 90, 8, 60);  // Aft mast

                // Sails
                ctx.beginPath();
                // Main sail
                ctx.moveTo(134, 70);
                ctx.quadraticCurveTo(170, 95, 134, 120);
                ctx.closePath();
                // Fore sail
                ctx.moveTo(83, 90);
                ctx.quadraticCurveTo(110, 110, 83, 130);
                ctx.closePath();
                ctx.fill();

                // Pirate Flag
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.moveTo(122, 60);
                ctx.lineTo(95, 70);
                ctx.lineTo(122, 80);
                ctx.closePath();
                ctx.fill();

            } else {
                // Palace / City Gate (Colored: yellow, green, or blue)
                let colorHex = '#eab308'; // Yellow default
                if (type === 'green') colorHex = '#16a34a';
                if (type === 'blue') colorHex = '#2563eb';

                // Main Building Body
                ctx.fillStyle = colorHex;
                
                // Base & Walls
                ctx.fillRect(60, 120, 136, 80);

                // Towers
                ctx.fillRect(50, 80, 35, 120);  // Left tower
                ctx.fillRect(171, 80, 35, 120); // Right tower
                ctx.fillRect(100, 60, 56, 140); // Center tower

                // Roof Roofs / Domes
                ctx.beginPath();
                ctx.arc(67, 80, 17.5, Math.PI, 0); // Left roof
                ctx.arc(188.5, 80, 17.5, Math.PI, 0); // Right roof
                ctx.arc(128, 60, 28, Math.PI, 0); // Center dome
                ctx.fill();

                // Gate Entrance
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(128, 200, 22, Math.PI, 0);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // --- Three.js Setup ---
        const container = document.getElementById('canvasContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); // Slate-900 match

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 9, 11);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Ambient & Directional Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(8, 15, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Ground Plane (Shadow Receiver)
        const planeGeo = new THREE.PlaneGeometry(30, 30);
        const planeMat = new THREE.ShadowMaterial({ opacity: 0.25 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -1.2;
        plane.receiveShadow = true;
        scene.add(plane);

        // --- Dice Creation Functions ---
        
        // Standard Dice Geometry with rounded corners appearance
        const dieGeometry = new THREE.BoxGeometry(1.6, 1.6, 1.6);

        // Mapping standard 6-sided dice faces:
        // Three.js Box Face order: 0: +X, 1: -X, 2: +Y, 3: -Y, 4: +Z, 5: -Z
        // Standard die face values mapping:
        // 1 opposite 6, 2 opposite 5, 3 opposite 4
        function createRedDice() {
            const materials = [
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(1, '#dc2626', '#ffffff'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(6, '#dc2626', '#ffffff'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(2, '#dc2626', '#ffffff'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(5, '#dc2626', '#ffffff'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(3, '#dc2626', '#ffffff'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(4, '#dc2626', '#ffffff'), roughness: 0.3 })
            ];
            const mesh = new THREE.Mesh(dieGeometry, materials);
            mesh.castShadow = true;
            return mesh;
        }

        function createYellowDice() {
            const materials = [
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(1, '#eab308', '#0f172a'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(6, '#eab308', '#0f172a'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(2, '#eab308', '#0f172a'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(5, '#eab308', '#0f172a'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(3, '#eab308', '#0f172a'), roughness: 0.3 }),
                new THREE.MeshStandardMaterial({ map: createStandardDiceFaceTexture(4, '#eab308', '#0f172a'), roughness: 0.3 })
            ];
            const mesh = new THREE.Mesh(dieGeometry, materials);
            mesh.castShadow = true;
            return mesh;
        }

        // White Event Dice (3x Ship, 1x Yellow Palace, 1x Green Palace, 1x Blue Palace)
        function createEventDice() {
            const materials = [
                new THREE.MeshStandardMaterial({ map: createEventDiceFaceTexture('ship'), roughness: 0.3 }),   // Face 1: Ship
                new THREE.MeshStandardMaterial({ map: createEventDiceFaceTexture('ship'), roughness: 0.3 }),   // Face 2: Ship
                new THREE.MeshStandardMaterial({ map: createEventDiceFaceTexture('ship'), roughness: 0.3 }),   // Face 3: Ship
                new THREE.MeshStandardMaterial({ map: createEventDiceFaceTexture('yellow'), roughness: 0.3 }), // Face 4: Yellow Palace
                new THREE.MeshStandardMaterial({ map: createEventDiceFaceTexture('green'), roughness: 0.3 }),  // Face 5: Green Palace
                new THREE.MeshStandardMaterial({ map: createEventDiceFaceTexture('blue'), roughness: 0.3 })   // Face 6: Blue Palace
            ];
            const mesh = new THREE.Mesh(dieGeometry, materials);
            mesh.castShadow = true;
            return mesh;
        }

        // Instantiate 3 dice
        const redDie = createRedDice();
        const yellowDie = createYellowDice();
        const eventDie = createEventDice();

        scene.add(redDie);
        scene.add(yellowDie);
        scene.add(eventDie);

        // Target Base Positions
        const posRed = new THREE.Vector3(-2.4, 0, 0);
        const posYellow = new THREE.Vector3(0, 0, 0);
        const posEvent = new THREE.Vector3(2.4, 0, 0);

        redDie.position.copy(posRed);
        yellowDie.position.copy(posYellow);
        eventDie.position.copy(posEvent);

        // Rotations corresponding to each face resting on top (+Y axis facing up):
        // Face Index in Materials: 
        // 0: +X, 1: -X, 2: +Y, 3: -Y, 4: +Z, 5: -Z
        // Target Euler rotations to orient specific face to UP (+Y):
        const faceRotationsStandard = {
            1: new THREE.Euler(0, 0, -Math.PI / 2),
            6: new THREE.Euler(0, 0, Math.PI / 2),
            2: new THREE.Euler(0, 0, 0),
            5: new THREE.Euler(Math.PI, 0, 0),
            3: new THREE.Euler(-Math.PI / 2, 0, 0),
            4: new THREE.Euler(Math.PI / 2, 0, 0)
        };

        const faceRotationsEvent = {
            1: { type: 'ship', text: '⛵ Πειρατές', euler: new THREE.Euler(0, 0, -Math.PI / 2) },
            2: { type: 'ship', text: '⛵ Πειρατές', euler: new THREE.Euler(0, 0, Math.PI / 2) },
            3: { type: 'ship', text: '⛵ Πειρατές', euler: new THREE.Euler(0, 0, 0) },
            4: { type: 'yellow', text: '🟡 Κίτρινη Πόλη', euler: new THREE.Euler(Math.PI, 0, 0) },
            5: { type: 'green', text: '🟢 Πράσινη Πόλη', euler: new THREE.Euler(-Math.PI / 2, 0, 0) },
            6: { type: 'blue', text: '🔵 Μπλε Πόλη', euler: new THREE.Euler(Math.PI / 2, 0, 0) }
        };

        // Rolling State
        let isRolling = false;
        let rollStartTime = 0;
        const rollDuration = 1100; // ms

        // Animation targets
        let targetRedFace = 1;
        let targetYellowFace = 1;
        let targetEventFace = 1;

        let totalRollsCount = 0;

        function rollDice() {
            if (isRolling) return;

            playRollSound();
            isRolling = true;
            rollStartTime = performance.now();

            // Random outcomes
            targetRedFace = Math.floor(Math.random() * 6) + 1;
            targetYellowFace = Math.floor(Math.random() * 6) + 1;
            targetEventFace = Math.floor(Math.random() * 6) + 1;

            // Reset initial random spin speeds
            [redDie, yellowDie, eventDie].forEach(die => {
                die.userData.spinSpeedX = (Math.random() + 1) * 15;
                die.userData.spinSpeedY = (Math.random() + 1) * 15;
                die.userData.spinSpeedZ = (Math.random() + 1) * 15;
                die.userData.bounceHeight = 2.5 + Math.random() * 1.5;
            });
        }

        function updateUIResults() {
            const red = targetRedFace;
            const yellow = targetYellowFace;
            const eventInfo = faceRotationsEvent[targetEventFace];
            const sum = red + yellow;

            document.getElementById('totalValue').textContent = sum;
            document.getElementById('redVal').textContent = red;
            document.getElementById('yellowVal').textContent = yellow;

            const eventValEl = document.getElementById('eventVal');
            eventValEl.textContent = eventInfo.text;
            
            // Color badge adjustment for event outcome
            if (eventInfo.type === 'ship') eventValEl.className = 'text-xs font-bold text-slate-100 bg-slate-800 px-2 py-1 rounded w-full';
            if (eventInfo.type === 'yellow') eventValEl.className = 'text-xs font-bold text-yellow-300 bg-yellow-950/80 border border-yellow-500/50 px-2 py-1 rounded w-full';
            if (eventInfo.type === 'green') eventValEl.className = 'text-xs font-bold text-emerald-300 bg-emerald-950/80 border border-emerald-500/50 px-2 py-1 rounded w-full';
            if (eventInfo.type === 'blue') eventValEl.className = 'text-xs font-bold text-blue-300 bg-blue-950/80 border border-blue-500/50 px-2 py-1 rounded w-full';

            // Add item to History
            totalRollsCount++;
            document.getElementById('rollCounter').textContent = `Σύνολο: ${totalRollsCount}`;

            const historyList = document.getElementById('historyList');
            if (totalRollsCount === 1) historyList.innerHTML = ''; // Clear placeholder text

            const historyItem = document.createElement('div');
            historyItem.className = 'flex justify-between items-center bg-slate-900/90 p-2 rounded border border-slate-800 hover:border-slate-700 transition';
            historyItem.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="font-mono text-slate-500 text-[10px]">#${totalRollsCount}</span>
                    <span class="font-bold text-amber-400">Σύνολο: ${sum}</span>
                    <span class="text-slate-400 text-[11px]">(${red} + ${yellow})</span>
                </div>
                <div class="text-[11px] font-medium">${eventInfo.text}</div>
            `;
            historyList.prepend(historyItem);
        }

        // Animation Loop
        function animate(now) {
            requestAnimationFrame(animate);

            if (isRolling) {
                const elapsed = now - rollStartTime;
                const progress = Math.min(elapsed / rollDuration, 1.0);

                if (progress < 1.0) {
                    // Decay spin speed
                    const factor = 1 - progress;

                    [
                        { die: redDie, basePos: posRed },
                        { die: yellowDie, basePos: posYellow },
                        { die: eventDie, basePos: posEvent }
                    ].forEach(({ die, basePos }) => {
                        die.rotation.x += die.userData.spinSpeedX * factor * 0.1;
                        die.rotation.y += die.userData.spinSpeedY * factor * 0.1;
                        die.rotation.z += die.userData.spinSpeedZ * factor * 0.1;

                        // Bounce motion curve
                        const bounce = Math.sin(progress * Math.PI * 3) * die.userData.bounceHeight * (1 - progress);
                        die.position.y = basePos.y + bounce;
                    });

                } else {
                    // Lock final positions and rotations smoothly
                    isRolling = false;

                    redDie.position.copy(posRed);
                    yellowDie.position.copy(posYellow);
                    eventDie.position.copy(posEvent);

                    // Set target rotation angles
                    const rTarget = faceRotationsStandard[targetRedFace];
                    const yTarget = faceRotationsStandard[targetYellowFace];
                    const eTarget = faceRotationsEvent[targetEventFace].euler;

                    // Add random full Y rotations for natural variability
                    redDie.rotation.set(rTarget.x, rTarget.y + Math.PI * 2, rTarget.z);
                    yellowDie.rotation.set(yTarget.x, yTarget.y + Math.PI * 2, yTarget.z);
                    eventDie.rotation.set(eTarget.x, eTarget.y + Math.PI * 2, eTarget.z);

                    updateUIResults();
                }
            } else {
                // Subtle floating/idle animation when stationary
                const idle = Math.sin(now * 0.002) * 0.05;
                redDie.position.y = posRed.y + idle;
                yellowDie.position.y = posYellow.y + idle;
                eventDie.position.y = posEvent.y + idle;
            }

            renderer.render(scene, camera);
        }

        // Responsive Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Click / Touch Trigger on Canvas & Button
        document.getElementById('rollBtn').addEventListener('click', rollDice);
        container.addEventListener('click', rollDice);

        // Keyboard Spacebar Trigger
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                rollDice();
            }
        });

        // Reset Companion Stats
        document.getElementById('resetStatsBtn').addEventListener('click', () => {
            totalRollsCount = 0;
            document.getElementById('rollCounter').textContent = 'Σύνολο: 0';
            document.getElementById('totalValue').textContent = '--';
            document.getElementById('redVal').textContent = '--';
            document.getElementById('yellowVal').textContent = '--';
            document.getElementById('eventVal').textContent = '--';
            document.getElementById('eventVal').className = 'text-sm font-bold text-slate-100 min-h-[24px] flex items-center justify-center';
            document.getElementById('historyList').innerHTML = '<div class="text-slate-500 text-center py-4 italic">Δεν υπάρχουν ακόμη ρίψεις.</div>';
        });

        // Start Animation Loop on Load
        window.onload = function () {
            requestAnimationFrame(animate);
        };
    </script>
</body>
